<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monty & Poppy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout idea: one arcade cabinet. HUD strip, pixel scene, RPG text box, then a gamepad. Single dark arcade theme by choice. */
:root{
  color-scheme: dark;
  --ink:#0d1020;
  --panel:#141a33;
  --line:#3a4470;
  --cream:#f4ecd8;
  --navy:#1F3A5F;
  --gold:#e8b84a;
  --poppy:#C4501F;
  --green:#3f8f4f;
  --display:"Press Start 2P","Courier New",monospace;
  --body:"VT323","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{touch-action:manipulation;-webkit-text-size-adjust:100%;background:var(--ink);color:var(--cream);font-family:var(--body);font-size:20px}
.wrap{--chrome:215px;max-width:max(300px,min(1000px,calc((100vh - var(--chrome)) * 1.0667)));margin:0 auto;padding:10px 16px 16px;display:flex;flex-direction:column;gap:10px}
@supports (height:100dvh){.wrap{max-width:max(300px,min(1000px,calc((100dvh - var(--chrome)) * 1.0667)))}}
@media (hover:hover) and (pointer:fine){.wrap{--chrome:150px}.pad{display:none !important}}
@media (hover:none),(pointer:coarse){.help{display:none}}
@media (max-width:520px){.wrap{padding:6px 8px 10px;gap:6px}}
.cab{container-type:inline-size;border:4px solid #000;box-shadow:0 0 0 4px var(--line);background:#000}
.hud{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:space-between;padding:6px 8px;background:var(--panel);font-family:var(--display);font-size:clamp(7px,1.6cqw,12px)}
@container (max-width:480px){#hCount{display:none}}
#hZone{color:var(--gold)}
.hbtns{display:flex;gap:6px}
button{font-family:var(--display);cursor:pointer;color:#10162c;background:var(--gold);border:3px solid #000;box-shadow:2px 2px 0 #000;padding:12px 16px;font-size:clamp(10px,2.3cqw,13px);line-height:1.3}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:2px}
button:active{transform:translate(2px,2px);box-shadow:none}
.hud button{padding:8px 10px;font-size:clamp(8px,1.9cqw,11px);background:var(--panel);color:var(--cream);border-color:var(--line)}
.stage{position:relative;aspect-ratio:256/240;background:#000;overflow:hidden}
#cv{touch-action:none;display:block;width:100%;height:76.667%;image-rendering:pixelated;image-rendering:crisp-edges}
.textbox{position:absolute;left:0;right:0;bottom:0;height:23.333%;background:#0a0d1c;border-top:4px solid var(--gold);display:flex;gap:10px;padding:6px 8px;align-items:flex-start}
#pc{height:70%;aspect-ratio:1;image-rendering:pixelated;border:2px solid var(--line);flex:none;align-self:center}
.ptext{flex:1;min-width:0;font-size:clamp(13px,3.5cqw,27px);line-height:1;overflow:hidden;height:100%}
#pWho{display:block;font-family:var(--display);font-weight:400;font-size:clamp(7px,1.6cqw,10px);color:var(--gold);margin-bottom:3px}
#pMore{font-family:var(--display);font-style:normal;font-size:clamp(7px,1.5cqw,9px);color:var(--gold);margin-left:6px;animation:blink 1s steps(2) infinite}
.ov{position:absolute;inset:0;background:rgba(8,10,25,.9);overflow-y:auto;display:grid;place-items:center;padding:10px}
.ov[hidden]{display:none}
.ov.see{background:rgba(8,10,25,.55)}
.dlg{width:min(100%,660px);display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;font-size:clamp(14px,3.6cqw,25px);line-height:1.05}
.dlg.box{background:var(--cream);color:#10162c;border:4px solid #000;box-shadow:0 0 0 4px var(--gold);padding:12px}
.dlg h2,.dlg h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.5}
.dlg h2{font-size:clamp(13px,4cqw,24px);color:var(--gold);text-shadow:3px 3px 0 #000}
.dlg h3{font-size:clamp(10px,2.4cqw,16px)}
.dlg p{margin:0}
.dlg ul{margin:0;padding:0;list-style:none;text-align:left;display:flex;flex-direction:column;gap:5px;width:100%}
.dlg li{padding-left:14px;position:relative}
.dlg li::before{content:"";position:absolute;left:0;top:.35em;width:7px;height:7px;background:var(--poppy)}
.dlg li b{font-family:var(--display);font-weight:400;font-size:.5em;display:block;color:var(--navy);margin-bottom:2px}
.small{font-size:.8em;opacity:.85}
.dlg input{font-family:var(--display);font-size:clamp(10px,2.6cqw,14px);padding:8px;width:min(100%,240px);text-align:center;text-transform:uppercase;background:#fff;color:#10162c;border:3px solid #000}
.hs{list-style:none;margin:0;padding:0;width:min(100%,320px);font-family:var(--display);font-size:clamp(8px,2cqw,11px);display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.hs li{display:flex;justify-content:space-between;gap:10px;padding:4px 6px;background:var(--panel)}
.hs li.me{background:var(--gold);color:#10162c}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.mapgrid{display:flex;flex-direction:column;gap:8px;width:100%}
.maprow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.maprow span{font-family:var(--display);font-size:clamp(7px,1.7cqw,10px);width:100%;color:var(--gold)}
.maprow button{font-size:clamp(8px,2cqw,11px);padding:9px 10px}
.maprow button.m{background:#9db7dd}.maprow button.p{background:#f0a184}.maprow button.ok{background:#7be08a}
a.btn{font-family:var(--display);font-size:clamp(10px,2.3cqw,13px);color:#10162c;background:#9db7dd;border:3px solid #000;box-shadow:2px 2px 0 #000;padding:12px 16px;text-decoration:none;line-height:1.3}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.stats div{background:var(--panel);color:var(--cream);border:2px solid #000;padding:6px 2px;font-size:.8em}
.stats b{display:block;font-family:var(--display);font-weight:400;color:var(--gold);font-size:clamp(10px,3cqw,18px);margin-bottom:3px;font-variant-numeric:tabular-nums}
.strip{display:flex;gap:3px;padding:5px 6px;background:#0a0d1c;border-bottom:2px solid #000}
.chip{flex:1;min-width:0;text-align:center;font-family:var(--display);font-size:clamp(7px,1.7cqw,10px);padding:4px 0 3px;background:#2a3157;color:#aab1d0;border:2px solid #000;overflow:hidden}
.chip small{display:block;font-family:var(--body);font-size:10px;line-height:1;margin-top:2px}
.chip.gap{margin-left:8px}
.chip.done{background:#7be08a;color:#10162c}
.chip.now{background:var(--gold);color:#10162c}
@media (max-width:520px){.chip small{display:none}}
.pad{display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--panel);border-top:4px solid #000;touch-action:none;user-select:none;-webkit-user-select:none}
.pad div{display:flex;gap:10px}
.pad button{touch-action:manipulation;width:clamp(58px,17cqw,76px);height:clamp(58px,17cqw,76px);padding:0;font-size:20px;background:#2a3157;color:var(--cream);border-color:#000}
.pad #kA{background:var(--poppy);color:#fff;border-radius:50%}
.pad #kB{background:var(--navy);color:#fff;border-radius:50%;font-size:20px}
.help{margin:0;color:#aab1d0;text-align:center;font-size:18px}
@media (prefers-reduced-motion:reduce){.blink,#pMore{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="cab">
    <div class="hud">
      <span id="hZone">THE OFFICE</span>
      <span id="hCount"></span>
      <span id="hScore">SCORE 000000</span>
      <span class="hbtns"><button id="bMap" type="button">MAP</button><button id="bSnd" type="button">SOUND ON</button></span>
    </div>
    <div class="strip" id="strip" aria-label="Pipeline progress"></div>
    <div class="stage">
      <canvas id="cv" width="256" height="184" aria-label="Pixel office action scene. The text box below describes what is happening."></canvas>
      <div class="textbox" aria-live="polite">
        <canvas id="pc" width="20" height="20" aria-hidden="true"></canvas>
        <div class="ptext"><b id="pWho"></b><span id="pTxt"></span><i id="pMore" hidden>A</i></div>
      </div>
      <div class="ov" id="ov" hidden></div>
    </div>
    <div class="pad">
      <div><button id="kL" type="button" aria-label="Move left">&#9664;</button><button id="kR" type="button" aria-label="Move right">&#9654;</button></div>
      <div><button id="kB" type="button" aria-label="B, open the map">B</button><button id="kA" type="button" aria-label="A, action">A</button></div>
    </div>
  </div>
  <p class="help">Arrow keys or A and D to move. Space or Enter to act. Esc for the map. You can also swipe or tap the screen in some rooms.</p>
</div>

<script>
/* ============================================================
   MONTY & POPPY: an office action explainer. Original art,
   original music. All numbers below come from Daniel's spec.
============================================================ */
const STATS = { screened: 371, evals: 120, apps: 52, interviews: 4 };
const LINKEDIN = "https://www.linkedin.com/in/danielglaw";

const $ = id => document.getElementById(id);
const cv = $("cv"), pcv = $("pc"), ov = $("ov");
let ctx = cv.getContext("2d"); const mainCtx = ctx, pctx = pcv.getContext("2d");
const W = 256, FY = 174, F = "8px 'Press Start 2P', monospace";
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const NAVY = "#1F3A5F", GOLD = "#e8b84a", CREAM = "#f4ecd8", RED = "#C4501F", GREEN = "#3f8f4f", BAD = "#ff8a7a", GOOD = "#7be08a", DARK = "#141a33";
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function txt(s, x, y, col, al) {
  ctx.font = F; ctx.textAlign = al || "left"; ctx.textBaseline = "top";
  ctx.fillStyle = "#000"; ctx.fillText(s, Math.round(x) + 1, Math.round(y) + 1);
  ctx.fillStyle = col || "#fff"; ctx.fillText(s, Math.round(x), Math.round(y));
}
function tag(s, x, y, col, bg) {
  const w = s.length * 8; x = Math.round(clamp(x, w / 2 + 3, W - w / 2 - 3)); y = Math.round(y);
  R(x - w / 2 - 2, y - 2, w + 4, 11, bg || DARK);
  ctx.font = F; ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.fillStyle = col || "#fff"; ctx.fillText(s, x, y);
}

/* ---------------- audio: chiptune loop plus effects ---------------- */
let ac = null, master = null, soundOn = true, musT = 0, musStep = 0, nbuf = null;
const mf = n => 440 * Math.pow(2, (n - 69) / 12);
const LEAD = [76,0,79,0,83,0,79,76, 74,0,76,0,71,0,0,71, 72,0,76,0,79,0,76,72, 74,0,78,0,81,0,78,74];
function toneAt(type, f, t, d, v, f2) {
  if (!ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
function noiseAt(t, d, v) {
  if (!ac || !nbuf) return;
  try {
    const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = nbuf;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    s.connect(g); g.connect(master); s.start(t); s.stop(t + d + 0.02);
  } catch (e) {}
}
const tone = (type, f, delay, d, v, f2) => ac && toneAt(type, f, ac.currentTime + delay, d, v, f2);
function sched() {
  if (!ac || ac.state !== "running") return;
  if (musT < ac.currentTime) musT = ac.currentTime + 0.05;
  while (musT < ac.currentTime + 0.2) {
    const s = musStep % 32, hi = (musStep % 64) >= 32;
    const root = [40, 40, 36, 38][s >> 3], bp = [0, -1, 0, 12, -1, 0, 12, 0][s & 7];
    if (bp >= 0) toneAt("triangle", mf(root + bp), musT, 0.1, 0.16);
    if (LEAD[s]) toneAt("square", mf(LEAD[s] + (hi ? 12 : 0)), musT, 0.1, 0.03);
    if ((s & 7) === 0 || (s & 7) === 3) toneAt("sine", 130, musT, 0.09, 0.22, 40);
    if ((s & 7) === 4) noiseAt(musT, 0.08, 0.07); else if (!(s & 1)) noiseAt(musT, 0.02, 0.02);
    musT += 0.107; musStep++;
  }
}
function initAudio() {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = soundOn ? 1 : 0; master.connect(ac.destination);
      nbuf = ac.createBuffer(1, 4410, 44100); const d = nbuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      setInterval(sched, 40);
    }
    if (ac.state === "suspended") ac.resume();
  } catch (e) { ac = null; }
}
const sfx = {
  shoot() { tone("square", 900, 0, 0.09, 0.05, 200); },
  coin() { tone("square", 988, 0, 0.07, 0.05); tone("square", 1319, 0.07, 0.14, 0.05); },
  buzz() { tone("sawtooth", 120, 0, 0.25, 0.07, 80); },
  thud() { tone("square", 140, 0, 0.1, 0.09, 50); noiseAt(ac ? ac.currentTime : 0, 0.06, 0.08); },
  blip() { tone("square", 660, 0, 0.05, 0.04); },
  rep() { tone("square", 220, 0, 0.09, 0.05, 440); },
  bell() { [0, 0.18].forEach(d => { tone("sine", 2093, d, 0.25, 0.06); tone("sine", 1568, d, 0.25, 0.04); }); },
  church() { [0, 0.7].forEach(d => { tone("sine", 196, d, 1.2, 0.2); tone("sine", 392, d, 1.0, 0.09); tone("sine", 587, d, 0.8, 0.04); }); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone("square", f, i * 0.08, 0.1, 0.05)); }
};

/* ---------------- people (original pixel characters) ---------------- */
const LOOK = {
  monty: { skin: "#f0c090", coat: NAVY, shirt: CREAM, legs: "#16263f", shoe: "#000", hair: "#3a2a1a" },
  poppy: { skin: "#b97a50", coat: GREEN, shirt: "#fff", legs: "#2c5e36", shoe: "#3a2a1a", hair: "#2a1a12" },
  daniel: { skin: "#8a5a3a", coat: "#2a7f9e", shirt: CREAM, legs: "#333a55", shoe: "#111", hair: "#1a1210" }
};
let T = 0;
function person(k, x, fy, pose, dir, a) {
  const L = LOOK[k]; x = Math.round(x); fy = Math.round(fy); a = a || 0;
  const ph = Math.floor(T / 130) % 2, fx = dir >= 0 ? 1 : -1;
  if (pose === "sleep") {
    R(x - 11, fy - 5, 15, 5, L.coat); R(x - 11, fy - 2, 4, 2, L.legs);
    R(x + 4, fy - 8, 7, 7, L.skin); R(x + 6, fy - 5, 2, 1, "#000"); R(x + 9, fy - 5, 1, 1, "#000");
    R(x + 4, fy - 9, 7, 2, L.hair); return;
  }
  const jump = pose === "jack" && ph;
  let o = 0; if (jump) o = -3; if (pose === "lift") o = a > 0.35 ? -1 : 1; if (pose === "bike") o = -3;
  const ly = fy + (jump ? -3 : 0);
  if (pose === "bike") { const q = a > 0 ? Math.floor(T / 80) % 2 : 0; R(x - 3, fy - 9, 3, q ? 7 : 5, L.legs); R(x + 1, fy - 9, 3, q ? 5 : 7, L.legs); }
  else if (pose === "walk") {
    R(x - 4, ly - 6, 3, ph ? 5 : 6, L.legs); R(x + 1, ly - 6, 3, ph ? 6 : 5, L.legs);
    R(x - 4 + (fx > 0 ? 0 : -1), ly - (ph ? 2 : 1), 4, 1, L.shoe); R(x + 1 + (fx > 0 ? 0 : -1), ly - (ph ? 1 : 2), 4, 1, L.shoe);
  } else if (jump) { R(x - 6, ly - 6, 3, 6, L.legs); R(x + 3, ly - 6, 3, 6, L.legs); }
  else { R(x - 4, ly - 6, 3, 6, L.legs); R(x + 1, ly - 6, 3, 6, L.legs); R(x - 4, ly - 1, 3, 1, L.shoe); R(x + 1, ly - 1, 3, 1, L.shoe); }
  const ty = fy - 15 + o;
  R(x - 5, ty, 10, 9, L.coat);
  if (k === "monty") { R(x - 1, ty, 2, 9, L.shirt); R(x - 1, ty + 3, 1, 1, GOLD); R(x - 1, ty + 6, 1, 1, GOLD); R(x + 2, ty + 5, 2, 1, GOLD); }
  if (k === "poppy") { R(x - 5, ty + 8, 10, 1, "#fff"); for (let i = 0; i < 6; i++) R(x - 3 + i, ty + 1 + i, 1, 1, "#7a4e30"); R(x + 2, ty + 6, 5, 5, "#7a4e30"); R(x + 3, ty + 5, 3, 1, "#fff"); }
  if (k === "daniel") R(x - 1, ty, 2, 3, L.shirt);
  const arm = sx => { R(x + sx, ty, 2, 7, L.coat); R(x + sx, ty + 7, 2, 1, L.skin); };
  if (pose === "shoot") { arm(fx > 0 ? -7 : 5); R(x + (fx > 0 ? 5 : -7), ty - 8, 2, 9, L.coat); R(x + (fx > 0 ? 4 : -8), ty - 12, 4, 4, "#c8ccd8"); R(x + (fx > 0 ? 5 : -7), ty - 13, 2, 1, "#888"); }
  else if (pose === "lift") { const yb = a > 0.35 ? ty - 12 : ty - 1; R(x - 13, yb, 26, 1, "#c8ccd8"); R(x - 15, yb - 3, 3, 7, "#222"); R(x + 12, yb - 3, 3, 7, "#222"); R(x - 7, yb, 2, ty - yb + 2, L.coat); R(x + 5, yb, 2, ty - yb + 2, L.coat); }
  else if (jump) { R(x - 8, ty - 5, 2, 6, L.coat); R(x + 6, ty - 5, 2, 6, L.coat); }
  else if (pose === "punch") { const e = a > 0.4 ? 4 : 0; arm(fx > 0 ? -7 : 5); R(fx > 0 ? x + 5 : x - 11 - e, ty + 2, 6 + e, 2, L.coat); R(fx > 0 ? x + 11 + e : x - 12 - e, ty + 2, 1, 2, L.skin); }
  else if (pose === "carry") { R(fx > 0 ? x + 5 : x - 9, ty + 3, 4, 2, L.coat); R(fx > 0 ? x + 7 : x - 15, ty - 1, 8, 8, "#c99a62"); R(fx > 0 ? x + 10 : x - 12, ty + 2, 2, 2, "#c4201f"); }
  else if (pose === "bike") { R(fx > 0 ? x + 5 : x - 11, ty + 2, 6, 2, L.coat); arm(fx > 0 ? -7 : 5); }
  else { arm(-7); arm(5); }
  const hy = ty - 7, e = dir === 0 ? 0 : fx;
  R(x - 4, hy, 8, 7, L.skin); R(x - 2 + e, hy + 3, 1, 2, "#000"); R(x + 1 + e, hy + 3, 1, 2, "#000");
  if (k === "monty") {
    const ex = x + 1 + e;
    R(ex - 1, hy + 2, 3, 1, GOLD); R(ex - 1, hy + 5, 3, 1, GOLD); R(ex - 1, hy + 2, 1, 4, GOLD); R(ex + 1, hy + 2, 1, 4, GOLD); R(ex, hy + 3, 1, 2, "#000");
    R(x - 6, hy - 1, 12, 1, "#0d1626"); R(x - 4, hy - 7, 8, 6, "#16263f"); R(x - 4, hy - 3, 8, 1, GOLD);
  }
  if (k === "poppy") {
    R(x - 4, hy - 2, 8, 3, RED); R(fx > 0 ? x + 2 : x - 6, hy, 4, 1, "#8f3414");
    R(x - 1, hy - 5, 3, 3, "#e8402a"); R(x, hy - 4, 1, 1, "#111"); R(x + 2, hy - 3, 2, 1, GREEN);
    const bx = fx > 0 ? x - 5 : x + 4; R(bx, hy + 1, 1, 6, L.hair); R(bx - fx, hy + 3, 1, 6, L.hair);
  }
  if (k === "daniel") { R(x - 4, hy - 1, 8, 2, L.hair); R(x - 4, hy, 1, 3, L.hair); R(x + 3, hy, 1, 3, L.hair); }
}

/* ---------------- shared scenery ---------------- */
function room(zone, sign) {
  const wall = zone === "m" ? "#e9dfc6" : zone === "p" ? "#f3ecdc" : "#9aa0ad";
  const trim = zone === "m" ? NAVY : zone === "p" ? GREEN : "#5d6474";
  R(0, 0, W, 150, wall);
  for (let x = 8; x < W; x += 16) R(x, 3, 1, 115, "rgba(0,0,0,.05)");
  for (let x = 24; x < W; x += 80) { R(x, 0, 40, 3, "#fff"); R(x, 3, 40, 1, "#cfd3df"); }
  R(0, 118, W, 32, trim); R(0, 118, W, 2, zone === "p" ? "#fff" : GOLD);
  R(0, 150, W, 34, "#4a4f66"); for (let x = 0; x < W; x += 32) R(x, 150, 1, 34, "#3e4359"); R(0, 166, W, 1, "#3e4359");
  if (sign) { R(4, 4, sign.length * 8 + 8, 13, DARK); R(4, 16, sign.length * 8 + 8, 1, GOLD); txt(sign, 8, 7, GOLD); }
}
function danielDesk() {
  person("daniel", 226, 166, "stand", -1);

  R(210, 148, 12, 8, "#c8ccd8"); R(212, 150, 8, 4, "#7ec8f0"); R(208, 156, 16, 1, "#888");

/* ---------------- input ---------------- */
function dirPress(d) { if (mode === "play" && stage && st && !st.fin && stage.onDir) stage.onDir(st, d); }
function pressA() {
  if (mode === "ov") { const p = ov.querySelector("[data-p]"); if (p) p.click(); return; }
  if (mode === "dialog") { if (dN < dFull.length) dN = dFull.length; else { sfx.blip(); nextLine(); } return; }
  if (mode === "play" && stage) stage.onA(st);
}
function pressB() { if (mode === "ov") { if (ovActs.back) ovActs.back(); else if (ovActs.ok && prev !== "title") ovActs.ok(); } else openMap(); }
addEventListener("keydown", e => {
  const k = e.key.toLowerCase(), onCtl = e.target.closest && e.target.closest("button,a");
  if (e.target.tagName === "INPUT") return;
  if (k === "arrowleft" || k === "a") { keys.l = true; if (mode !== "ov") { e.preventDefault(); if (!e.repeat) dirPress(-1); } }
  else if (k === "arrowright" || k === "d") { keys.r = true; if (mode !== "ov") { e.preventDefault(); if (!e.repeat) dirPress(1); } }
  else if (k === "arrowup" || k === "w") { if (mode !== "ov") { e.preventDefault(); if (stage && stage.grid) dirPress(-3); } }
  else if (k === "arrowdown" || k === "s") { if (mode !== "ov") { e.preventDefault(); if (stage && stage.grid) dirPress(3); } }
  else if (k === " " || k === "enter") { if (mode === "ov" || onCtl) return; e.preventDefault(); if (!e.repeat) pressA(); }
  else if (k === "escape") { e.preventDefault(); pressB(); }
});
addEventListener("keyup", e => { const k = e.key.toLowerCase(); if (k === "arrowleft" || k === "a") keys.l = false; if (k === "arrowright" || k === "d") keys.r = false; });
addEventListener("blur", () => { keys.l = keys.r = false; });
function hold(id, key) {
  const el = $(id), on = e => { e.preventDefault(); keys[key] = true; dirPress(key === "l" ? -1 : 1); }, off = () => { keys[key] = false; };
  el.addEventListener("pointerdown", on); ["pointerup", "pointerleave", "pointercancel"].forEach(n => el.addEventListener(n, off));
}
hold("kL", "l"); hold("kR", "r");
function pt(e, down) {
  if (mode !== "play" || !stage || !st || st.fin || !stage.onPoint) return;
  const r = cv.getBoundingClientRect();
  stage.onPoint(st, (e.clientX - r.left) / r.width * 256, (e.clientY - r.top) / r.height * 184, down);
}
cv.addEventListener("pointerdown", e => pt(e, true));
cv.addEventListener("pointermove", e => { if (e.buttons || e.pointerType === "touch") pt(e, false); });
$("kA").addEventListener("pointerdown", e => { e.preventDefault(); pressA(); });
$("kB").addEventListener("pointerdown", e => { e.preventDefault(); pressB(); });
$("kA").addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); pressA(); } });
$("kB").addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); pressB(); } });
$("bMap").addEventListener("click", e => { e.currentTarget.blur(); if (mode === "ov") { if (ovActs.back) ovActs.back(); } else openMap(); });
$("bSnd").addEventListener("click", e => { soundOn = !soundOn; if (master) master.gain.value = soundOn ? 1 : 0; e.currentTarget.textContent = soundOn ? "SOUND ON" : "SOUND OFF"; e.currentTarget.blur(); });

/* ---------------- pipeline strip ---------------- */
const WORDS = ["MINE", "OMIT", "NUMBER", "TAILOR", "YIELD", "PROSPECT", "ORGANISE", "PERSONALISE", "PACE", "YIELD"];
let stripSig = "";
function updStrip() {
  const sig = si + "|" + done.join("");
  if (sig === stripSig) return; stripSig = sig;
  $("strip").innerHTML = WORDS.map((w, i) => '<span class="chip' + (i === 5 ? " gap" : "") + (i === si && stage ? " now" : done[i] ? " done" : "") + '">' + w[0] + "<small>" + w + "</small></span>").join("");
}

/* ---------------- main loop ---------------- */
function update(dt) {
  P.act = Math.max(0, P.act - dt); shake = Math.max(0, shake - dt);
  if (mode === "cut" && cut) {
    cut.t += dt;
    if (cut.t >= 1.6 && !cut.rang) { cut.rang = true; sfx.church(); setPanel("sys", "7:37 AM. The alarm rings. A scheduled run begins."); }
    if (cut.t >= 3 && cut.t < 4.8) setPanel("sys", "Lights on. A quick warm up before the shift.");
    if (cut.t >= 4.8 && !cut.said) {
      cut.said = true;
      talk([["monty", "Right then. Let's see what's on offer today."], ["poppy", "You hunt jobs. I'll find people."],
            ["sys", "Arrows to move. A to act. You get 3 hearts per room. Go!"]], () => startStage(0));
    }
  }
  if (mode === "dialog") {
    if (dN < dFull.length) dN = Math.min(dFull.length, dN + dt * 60);
    setPanel(pan.who, dFull.slice(0, Math.floor(dN))); $("pMore").hidden = dN < dFull.length;
  }
  if (mode === "play" && stage && st) {
    if (stage.move) { const d = (keys.r ? 1 : 0) - (keys.l ? 1 : 0); P.walk = d !== 0; if (d) { P.dir = d; P.x = clamp(P.x + d * 85 * dt, stage.min, stage.max); } }
    else P.walk = false;
    stage.update(dt, st);
    if (mode === "play" && !st.fin && st.time != null && !stage.ownTimer) { st.time -= dt; if (st.time <= 0) { st.time = 0; fail("Out of time."); } }
    if (mode === "play") setPanel("sys", stage.cap(st));
    $("hCount").textContent = stage.count ? stage.count(st) : "";
  } else P.walk = false;
  $("hScore").textContent = "SCORE " + pad6(total()); updStrip();
  for (const p of fx) { p.life -= dt; if (p.t === "p") { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; } else p.y -= 14 * dt; }
  fx = fx.filter(p => p.life > 0);
}
function draw() {
  ctx.save();
  if (shake > 0 && !RM) ctx.translate(Math.round((Math.random() - .5) * 4), Math.round((Math.random() - .5) * 3));
  if (!stage) drawIntro();
  else {
    stage.draw(st);
    const pose = (typeof stage.pose === 'function' && stage.pose(st)) || (P.walk ? "walk" : "stand");
    if (!stage.noPlayer) person(P.k, P.x, FY, pose, P.dir, stage.anim ? stage.anim(st) : 0);
    if (stage.front) stage.front(st);
    for (let i = 0; i < 3; i++) {
      const x = 221 + i * 11, c = i < st.hp ? "#e8402a" : "#555a70";
      R(x - 1, 4, 9, 10, DARK); R(x, 6, 3, 2, c); R(x + 4, 6, 3, 2, c); R(x, 7, 7, 3, c); R(x + 1, 10, 5, 1, c); R(x + 2, 11, 3, 1, c); R(x + 3, 12, 1, 1, c);
    }

  }
  for (const p of fx) { if (p.t === "p") R(p.x, p.y, p.w, p.h, p.c); else tag(p.s, p.x, p.y, p.c); }

let last = performance.now();
function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; T = now; update(dt); draw(); requestAnimationFrame(frame); }
mainCtx.imageSmoothingEnabled = false;
setPanel("sys", "The office is dark. Monty and Poppy are asleep until the next scheduled run.");
loadBoard();
showTitle();
requestAnimationFrame(frame);
</script>
